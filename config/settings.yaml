models:
  sentiment:
    model_name: "CAMeL-Lab/bert-base-arabic-camelbert-da-sentiment"
    fallback: true
    batch_size: 16
  prophet:
    forecast_periods: 90
    confidence_intervals: [0.80, 0.95]
    seasonality_mode: "multiplicative"
  dbscan:
    eps: 2.0
    min_samples: 2
  isolation_forest:
    contamination: 0.1
    random_state: 42
  elasticnet:
    cv: 5
    l1_ratio: [0.1, 0.5, 0.9]
    max_iter: 5000
    fallback: inverse_variance
  bootstrap:
    n_samples: 1000
    confidence: 0.95

dashboard:
  port: 8501
  theme: "rtl"
  refresh_interval: 3600

scheduler:
  interval_hours: 24

paths:
  raw: "data/raw"
  processed: "data/processed"
  sample: "data/sample"
  database: "data/platform_pulse.db"
  logs: "data/logs"
